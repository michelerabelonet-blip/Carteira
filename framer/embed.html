<!-- Cole este código no componente "Embed" do Framer, no modo HTML.
     Troque SEU-APP.onrender.com pelo endereço que o Render deu ao app.
     A altura acompanha o conteúdo sozinha (o app avisa a altura via postMessage). -->
<iframe id="montador" src="https://SEU-APP.onrender.com/" title="Montador de Carteira"
  style="width:100%;height:1500px;border:0;display:block" loading="lazy"></iframe>
<script>
(function () {
  var f = document.getElementById('montador');
  var origem = new URL(f.src).origin;
  window.addEventListener('message', function (e) {
    if (e.origin !== origem || e.source !== f.contentWindow) return;
    var h = e.data && e.data.montadorAltura;
    if (typeof h === 'number' && h > 200 && h < 20000) f.style.height = h + 'px';
  });
})();
</script>
